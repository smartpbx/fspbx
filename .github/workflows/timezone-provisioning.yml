name: Timezone and provisioning verification

on:
  pull_request:
    paths:
      - '.github/workflows/timezone-provisioning.yml'
      - 'app/Console/Commands/SyncFreeSwitchTimezones.php'
      - 'app/Console/Commands/UpdateApp.php'
      - 'app/Console/Commands/Updates/Update201.php'
      - 'app/Services/FreeSwitchTimezoneConfigService.php'
      - 'resources/autoload_configs/timezones.conf.xml'
      - 'resources/provisioning/fanvil/**'
      - 'resources/provisioning/poly/**'
      - 'resources/provisioning/polycom/**'
      - 'resources/provisioning/yealink/**'
      - 'smartpbx/native-templates/**'
      - 'tests/Unit/run-timezone-provisioning-verification.php'
  push:
    branches: [main]
    paths:
      - '.github/workflows/timezone-provisioning.yml'
      - 'app/Console/Commands/SyncFreeSwitchTimezones.php'
      - 'app/Console/Commands/UpdateApp.php'
      - 'app/Console/Commands/Updates/Update201.php'
      - 'app/Services/FreeSwitchTimezoneConfigService.php'
      - 'resources/autoload_configs/timezones.conf.xml'
      - 'resources/provisioning/fanvil/**'
      - 'resources/provisioning/poly/**'
      - 'resources/provisioning/polycom/**'
      - 'resources/provisioning/yealink/**'
      - 'smartpbx/native-templates/**'
      - 'tests/Unit/run-timezone-provisioning-verification.php'

concurrency:
  group: timezone-provisioning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: PHP lint and light verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Lint changed PHP
        run: |
          php -l app/Console/Commands/SyncFreeSwitchTimezones.php
          php -l app/Console/Commands/UpdateApp.php
          php -l app/Console/Commands/Updates/Update201.php
          php -l app/Services/FreeSwitchTimezoneConfigService.php
          php -l tests/Unit/run-timezone-provisioning-verification.php
      - name: Verify timezone generation and no-DST provisioning
        run: php tests/Unit/run-timezone-provisioning-verification.php
