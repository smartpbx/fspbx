name: ht818-smartpbx
vendor: grandstream
models: "HT818"
flavor: "cfgmac.xml"
cloned_from: "no stock template; ported from legacy grandstream/ht818 (stock HT80x V2 e476f3f4 is the wrong family)"
provisioning_url_setting: "grandstream_config_server_path (P237)"
line_variables: [server_address, server_address_secondary, outbound_proxy_primary, outbound_proxy_secondary, sip_port, sip_transport, register_expires, user_id, auth_id, password, display_name]
other_variables: [domain_name, mac, device_firmware_version, template, device_model, main_keys, expansion_keys]
settings_read:
  - admin_password
  - device_firmware_version
  - grandstream_call_waiting
  - grandstream_config_server_path
  - grandstream_dhcp_option_override
  - grandstream_dhcp_option_override_sip_server
  - grandstream_dhcp_time_zone
  - grandstream_dial_plan
  - grandstream_distinctive_ringtone_1
  - grandstream_distinctive_ringtone_2
  - grandstream_distinctive_ringtone_3
  - grandstream_distinctive_ringtone_name_1
  - grandstream_distinctive_ringtone_name_2
  - grandstream_distinctive_ringtone_name_3
  - grandstream_dns_mode
  - grandstream_dtmf_method_1
  - grandstream_dtmf_method_2
  - grandstream_dtmf_method_3
  - grandstream_fax_mode
  - grandstream_firmware_path
  - grandstream_firmware_upgrade_protocol
  - grandstream_gxp_time_zone
  - grandstream_ipv_mode
  - grandstream_nat_traversal
  - grandstream_send_sip_log
  - grandstream_srtp
  - grandstream_syslog_level
  - grandstream_syslog_server
  - grandstream_timezone
  - grandstream_tr069_periodic_inform_enable
  - http_auth_password
  - http_auth_username
  - ntp_server_primary
  - nway_conference
  - provision_base_url
  - subscribe_mwi
