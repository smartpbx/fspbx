name: ht80x-smartpbx
vendor: grandstream
models: "HT801, HT802 (one file; port-2 values render only for HT802)"
flavor: "cfgmac.xml"
cloned_from: "grandstream/HT80x V2 e476f3f4-15db-46ed-a017-31d1d20466e2 v1.0.10 (NOT used as base: ported from legacy grandstream/ht801 + ht802 files, 345/458 P-values vs 69 in stock)"
provisioning_url_setting: "grandstream_config_server_path (P237)"
