name: fanvil-v67-smartpbx
vendor: fanvil
models: "Fanvil V64/V67"
flavor: "mac.cfg (request <mac>.cfg)"
cloned_from: "no stock template; ported from legacy fanvil/v67 (static key layout, same as legacy)"
provisioning_url_setting: "fanvil_provision_url (FlashServerIP)"
