  time_dst: [fanvil_time_zone, fanvil_time_zone_name, fanvil_location, fanvil_dst_minute_offset, fanvil_enable_sntp, fanvil_time_display, fanvil_date_display, fanvil_date_separator, ntp_server_primary, ntp_server_secondary]
  softkeys: [fanvil_softkey_exit, fanvil_softkey_desktopsoftkey, fanvil_softkey_talkingsoftkey, fanvil_softkey_ringingsoftkey, fanvil_softkey_desktopclick]
  network_qos: [dns_server_primary, dns_server_secondary, fanvil_enable_vlan, fanvil_lan_port_vlan, fanvil_pc_port_vlan, fanvil_qos_sip, fanvil_qos_rtp_voice, fanvil_qos_rtp_video, fanvil_enable_diffserv, fanvil_dscp_sip, fanvil_dscp_rtp_voice, fanvil_dscp_rtp_video, fanvil_lldp_tx_enable, fanvil_lldp_refresh, fanvil_lldp_learn]
